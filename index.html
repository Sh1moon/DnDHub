<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon Master's Hub</title>
    <link rel="stylesheet" href="./dist/css/main.css">
    <link rel="icon" href="./src/img/favicon.svg" type="image/svg+xml">
</head>
<body>
    <nav class="navbar">
        <img src="./src/img/logo.svg" alt="Логотип" class="logo" data-route="home">
        <ul class="nav-links">
            <li><a href="#character-creator" class="nav-link protected-link" data-route="character-creator">Создать персонажа</a></li>
            <li><a href="#characters" class="nav-link protected-link" data-route="characters">Мои персонажи</a></li>
            <li><a href="#spellbook" class="nav-link protected-link" data-route="spellbook">Играть</a></li>
            <li><a href="#rooms" class="nav-link protected-link" data-route="rooms">Создать кампанию</a></li>
        </ul>
        <div class="user-section">
            <span class="user-name" id="userName"></span>
            <img src="./src/img/user.svg" alt="Пользователь" class="user-icon" id="userIcon">
            <div class="user-menu" id="userMenu">
                <div class="user-menu__info">
                    <div class="user-menu__name" id="userMenuName"></div>
                    <div class="user-menu__email" id="userMenuEmail"></div>
                </div>
                <button class="user-menu__item" id="adminPanelBtn" style="display: none;">Админ панель</button>
                <button class="user-menu__item" id="logoutBtn">Выйти</button>
            </div>
        </div>
    </nav>

    <main id="appContent">
        <!-- Контент будет загружаться динамически -->
    </main>

    <!-- Модальное окно авторизации (новое) -->
    <div class="auth-modal-overlay" id="authModal">
        <div class="auth-modal">
            <button class="auth-modal__close" id="closeAuthModal" aria-label="Закрыть">&times;</button>
            <div class="auth-modal__header">
                <h2 class="auth-modal__title" id="authModalTitle">Вход в аккаунт</h2>
                <p class="auth-modal__subtitle" id="authModalSubtitle">Добро пожаловать обратно!</p>
            </div>
            <div class="auth-modal__body">
                <form id="authForm" class="auth-form">
                    <div class="form-group" id="nameInputGroup" style="display: none;">
                        <label for="nameInput" class="form-label">Имя</label>
                        <input type="text" id="nameInput" class="form-input" placeholder="Введите ваше имя" autocomplete="name">
                        <span class="form-error" id="nameError"></span>
                    </div>
                    <div class="form-group">
                        <label for="username" class="form-label">Email или логин</label>
                        <input type="text" id="username" class="form-input" placeholder="Введите email или логин" required autocomplete="username">
                        <span class="form-error" id="usernameError"></span>
                    </div>
                    <div class="form-group" id="passwordGroup">
                        <label for="password" class="form-label">Пароль</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="password" class="form-input" placeholder="Введите пароль" required autocomplete="current-password" name="password">
                            <button type="button" class="password-toggle" id="passwordToggle" aria-label="Показать пароль">👁</button>
                        </div>
                        <span class="form-error" id="passwordError"></span>
                        <a href="#" class="forgot-password-link" id="forgotPassword">Забыли пароль?</a>
                    </div>
                    <div class="form-group form-group-checkbox" id="rememberMeGroup">
                        <label class="checkbox-label">
                            <input type="checkbox" id="rememberMe" class="checkbox-input">
                            <span class="checkbox-text">Запомнить меня</span>
                        </label>
                    </div>
                    <button type="submit" class="auth-submit-btn" id="submitBtn">
                        <span class="btn-text">Войти</span>
                        <span class="btn-loader" style="display: none;">⏳</span>
                    </button>
                </form>
            </div>
            <div class="auth-modal__footer">
                <div class="auth-switch">
                    <span id="authSwitchText">У меня нет аккаунта. </span>
                    <button type="button" class="auth-link" id="authSwitch">Зарегистрироваться</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Уведомление -->
    <div class="notification" id="notification"></div>

    <!-- Подключение JavaScript модулей -->
    <script src="./src/js/admin.js"></script>
    <script src="./src/js/database.js"></script>
    <script src="./src/js/auth.js"></script>
    <script src="./src/js/ui-components.js"></script>
    <script src="./src/js/confirm-modal.js"></script>
    <script src="./src/js/modal-fix.js"></script>
    <script src="./src/js/character-manager.js"></script>
    <script src="./src/js/character-list.js"></script>
    <script src="./src/js/room-manager.js"></script>
    <script src="./src/js/spellbook.js"></script>
    <script src="./src/js/campaign-game.js"></script>
    <script src="./src/js/friends-manager.js"></script>
    <script src="./src/js/app.js"></script>

    <!-- Обработчики меню пользователя управляются через app.js -->
</body>
</html>
